name: Build Windows Executable (jpackage)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Compilamos directamente en Windows para que jpackage cree el .exe nativo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java source files
      run: javac GitHubBackupApp.java

    - name: Package into JAR
      run: jar cfe GitHubBackup.jar GitHubBackupApp *.class

    - name: Create native Windows EXE using jpackage
      run: |
        jpackage \
          --type app-image \
          --name "GitHubBackup" \
          --input . \
          --main-jar GitHubBackup.jar \
          --main-class GitHubBackupApp \
          --dest output

    - name: Upload EXE Application Folder as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHubBackup-Windows-App
        path: output/GitHubBackup/
