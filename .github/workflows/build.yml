name: Build Java App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java source files
      run: javac GitHubBackupApp.java

    - name: Package into JAR including all generated classes
      run: jar cfe GitHubBackup.jar GitHubBackupApp *.class

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHubBackupApp
        path: GitHubBackup.jar
